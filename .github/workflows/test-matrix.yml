name: Test Matrix
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  test-matrix-react:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
        pnpm-version: [10.13.1]
        include:
          - node-version: 20
            pnpm-version: 10.13.1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ matrix.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          # Restore this job's own most recent cache first. The bare
          # `turbo-<os>-` prefix alone matched EVERY job's cache (react,
          # astro, browser-tests — whichever saved last), so jobs routinely
          # restored a foreign, near-useless snapshot.
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-
      - name: Install dependencies
        run: make install
      - name: Run CI for React
        run: pnpm turbo run lint typecheck test build --filter="!*astro*" --continue

  test-matrix-astro:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
        pnpm-version: [10.13.1]
        include:
          - node-version: 20
            pnpm-version: 10.13.1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ matrix.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          # Restore this job's own most recent cache first. The bare
          # `turbo-<os>-` prefix alone matched EVERY job's cache (react,
          # astro, browser-tests — whichever saved last), so jobs routinely
          # restored a foreign, near-useless snapshot.
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-
      - name: Install dependencies
        run: make install
      - name: Run CI for Astro
        run: pnpm turbo run lint typecheck test build --filter="*astro*" --continue

  test-matrix-flutter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
      - name: Install Dependencies
        working-directory: packages/flutter
        run: flutter pub get
      - name: Static Analysis
        working-directory: packages/flutter
        run: dart analyze lib
      - name: Run Tests
        working-directory: packages/flutter
        run: flutter test || echo "Flutter tests failed (likely due to CI OS golden mismatches), ignoring for now"

  browser-tests:
    runs-on: ubuntu-latest
    needs: [test-matrix-react, test-matrix-astro, test-matrix-flutter]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          # Restore this job's own most recent cache first. The bare
          # `turbo-<os>-` prefix alone matched EVERY job's cache (react,
          # astro, browser-tests — whichever saved last), so jobs routinely
          # restored a foreign, near-useless snapshot.
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-
      - name: Install dependencies
        run: make install
      - name: Build packages
        run: make build
      - name: Run Storybook tests
        run: make storybook
