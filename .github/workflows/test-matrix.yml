name: Test Matrix
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  test-matrix-react:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [10.13.1]
        include:
          - node-version: 22
            pnpm-version: 10.13.1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ matrix.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          # Restore this job's own most recent cache first. The bare
          # `turbo-<os>-` prefix alone matched EVERY job's cache (react,
          # astro, browser-tests — whichever saved last), so jobs routinely
          # restored a foreign, near-useless snapshot.
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-
      - name: Install dependencies
        run: make install
      - name: Run CI for React
        run: pnpm turbo run lint typecheck test build --filter="!*astro*" --continue

  test-matrix-astro:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
        pnpm-version: [10.13.1]
        include:
          - node-version: 22
            pnpm-version: 10.13.1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ matrix.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          # Restore this job's own most recent cache first. The bare
          # `turbo-<os>-` prefix alone matched EVERY job's cache (react,
          # astro, browser-tests — whichever saved last), so jobs routinely
          # restored a foreign, near-useless snapshot.
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-
      - name: Install dependencies
        run: make install
      - name: Run CI for Astro
        run: pnpm turbo run lint typecheck test build --filter="*astro*" --continue

  test-matrix-flutter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
      - name: Install Dependencies
        working-directory: packages/flutter
        run: flutter pub get
      - name: Static Analysis
        working-directory: packages/flutter
        run: dart analyze lib
      - name: Run Tests
        working-directory: packages/flutter
        # Only OS-specific visual baselines are excluded; behavior gates PRs.
        run: flutter test --exclude-tags golden
      - uses: pnpm/action-setup@v2
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install browser test dependencies
        run: make install
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build composer input harness
        working-directory: packages/flutter/example
        run: flutter build web --release --target lib/composer_input_harness.dart
      - name: Exercise real browser input and accessibility DOM
        run: pnpm exec playwright test --config playwright.flutter.config.ts

  test-matrix-flutter-native:
    name: Flutter native build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            flutter: 3.38.3
            build: apk --debug
          - platform: linux
            os: ubuntu-latest
            build: linux --release
          - platform: windows
            os: windows-latest
            build: windows --release
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          # Superlist 0.9.x requires AGP/Gradle 8; match the supported consumer SDK.
          flutter-version: ${{ matrix.flutter || 'any' }}
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux build toolchain
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - name: Create isolated native consumer
        shell: bash
        env:
          SMOKE_PLATFORM: ${{ matrix.platform }}
        run: |
          flutter create --platforms="$SMOKE_PLATFORM" --project-name clipboard_build_smoke "$RUNNER_TEMP/clipboard_build_smoke"
          echo "" >> "$RUNNER_TEMP/clipboard_build_smoke/pubspec.yaml"
          echo "dependency_overrides:" >> "$RUNNER_TEMP/clipboard_build_smoke/pubspec.yaml"
          echo "  refraction_ui:" >> "$RUNNER_TEMP/clipboard_build_smoke/pubspec.yaml"
          echo "    path: '$GITHUB_WORKSPACE/packages/flutter'" >> "$RUNNER_TEMP/clipboard_build_smoke/pubspec.yaml"
          cd "$RUNNER_TEMP/clipboard_build_smoke"
          flutter pub add refraction_ui
          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:refraction_ui/refraction_ui.dart';
          void main() => runApp(MaterialApp(home: Scaffold(body: RefractionComposer(onImagesPasted: (_) {}))));
          DART
      - name: Build native consumer with clipboard plugins
        shell: bash
        env:
          SMOKE_BUILD: ${{ matrix.build }}
        run: |
          cd "$RUNNER_TEMP/clipboard_build_smoke"
          flutter build $SMOKE_BUILD

  browser-tests:
    runs-on: ubuntu-latest
    needs: [test-matrix-react, test-matrix-astro, test-matrix-flutter]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          # Restore this job's own most recent cache first. The bare
          # `turbo-<os>-` prefix alone matched EVERY job's cache (react,
          # astro, browser-tests — whichever saved last), so jobs routinely
          # restored a foreign, near-useless snapshot.
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-
      - name: Install dependencies
        run: make install
      - name: Build packages
        run: make build
      - name: Run Storybook tests
        run: make storybook
