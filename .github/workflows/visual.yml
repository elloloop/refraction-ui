name: Visual Regression Tests

on:
  pull_request:
    branches: [main]

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: make install

      - name: Build packages
        run: make build-packages

      # Compile every docs route before navigation. Next dev recompiles routes
      # during screenshots and may restart when its memory threshold is reached.
      - name: Build documentation
        run: pnpm --filter refraction-ui-docs build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright visual tests
        env:
          # Only this lane prepares a production documentation build. Baseline
          # regeneration and the standalone harnesses keep their existing mode.
          REFRACTION_VISUAL_PRODUCTION: "1"
        run: pnpm e2e

      - name: Run Lost Pixel
        env:
          REFRACTION_VISUAL_PRODUCTION: "1"
        run: |
          pnpm --filter refraction-ui-docs exec next start > /tmp/refraction-ui-docs.log 2>&1 &
          DOCS_PID=$!
          trap 'kill "$DOCS_PID"' EXIT

          for _ in {1..60}; do
            if curl -fsS http://localhost:3000 >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://localhost:3000 >/dev/null
          pnpm visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: |
            e2e/results/
            .lostpixel/current/
            .lostpixel/difference/
          retention-days: 7
